services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: elearning-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: ./start.sh
    environment: &app-environment
      SECRET_KEY: local-docker-secret-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgresql://elearning:elearning-local-only@db:5432/elearning
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_ENABLED: "True"
      MEDIA_UPLOADS_ENABLED: "True"
      ALLOW_INSTRUCTOR_REGISTRATION: "True"
      SEED_DEMO_DATA: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
