name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: elearning_test
          POSTGRES_USER: elearning
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elearning -d elearning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-not-used-outside-automated-tests
      DEBUG: "True"
      DATABASE_URL: postgresql://elearning:ci-only-password@127.0.0.1:5432/elearning_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CACHE_URL: redis://127.0.0.1:6379/1
      CELERY_ENABLED: "False"
      # Exercise the normal upload workflow; resilience tests explicitly
      # override this to False to cover the storage-free public-demo mode.
      MEDIA_UPLOADS_ENABLED: "True"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check model migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run Django system checks
        run: python manage.py check
      - name: Verify production static build
        run: DEBUG=False MEDIA_UPLOADS_ENABLED=False ALLOWED_HOSTS=example.com CSRF_TRUSTED_ORIGINS=https://example.com SECURE_HSTS_SECONDS=3600 python manage.py collectstatic --noinput
      - name: Run test suite
        run: python manage.py test --verbosity 2
